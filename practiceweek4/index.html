<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* 加入平滑捲動效果，讓點擊按鈕跳轉時更順暢 */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 黃色標題框 (維持在最上方) */
        .banner {
            position: sticky;
            top: 0;
            background-color: #FFD700; /* 黃色 */
            padding: 15px 20px;
            display: flex;
            align-items: center;
            z-index: 1000; /* 確保下滑時覆蓋在其他內容之上 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 標題左手邊的四個灰色框 */
        .nav-boxes {
            display: flex;
            gap: 10px;
            margin-right: 20px;
        }

        .scene-btn {
            background-color: #808080; /* 灰色 */
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .scene-btn:hover {
            background-color: #606060;
        }

        /* 標題文字 */
        .banner-title {
            font-size: 24px;
            font-weight: bold;
            color: black;
        }

        /* 標題下方的主要排版 */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            gap: 20px;
        }

        /* 左側的 Scene 內容區塊 */
        .content-area {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .scene {
            min-height: 80vh; /* 給予足夠的高度以呈現滑動效果 */
            padding: 40px;
            background-color: #f9f9f9;
            border: 2px dashed #ccc;
            border-radius: 10px;
        }

        /* 右手邊的 Information 側邊欄 */
        .sidebar {
            flex: 1;
        }

        /* 粉色的 Information 框 */
        .info-box {
            background-color: #FFC0CB; /* 粉色 */
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: #333;
            /* 如果希望這個粉色框在下滑時也跟著固定在右側，可以加入這兩行： */
            position: sticky; 
            top: 100px; 
        }

        /* 頁尾灰色框 */
        .footer {
            background-color: #d3d3d3; /* 淺灰色 */
            color: #333;
            text-align: center;
            padding: 30px;
            font-size: 20px;
            font-weight: bold;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- 頂部區塊：黃色標題與灰色選單 -->
    <header class="banner">
        <nav class="nav-boxes">
            <a href="#scene1" class="scene-btn">Scene 1</a>
            <a href="#scene2" class="scene-btn">Scene 2</a>
            <a href="#scene3" class="scene-btn">Scene 3</a>
            <a href="#scene4" class="scene-btn">Scene 4</a>
        </nav>
        <div class="banner-title">Here Is Banner</div>
    </header>

    <!-- 內容區塊：左側 Scene 與 右側 Information -->
    <div class="main-container">
        
        <div class="content-area">
            <section id="scene1" class="scene">
                <h2>這是 Scene 1 的內容</h2>
                <p>試著往下捲動網頁，或者點選上方導覽列測試跳轉。</p>
            </section>
            
            <section id="scene2" class="scene">
                <h2>這是 Scene 2 的內容</h2>
            </section>
            
            <section id="scene3" class="scene">
                <h2>這是 Scene 3 的內容</h2>
            </section>
            
            <section id="scene4" class="scene">
                <h2>這是 Scene 4 的內容</h2>
            </section>
        </div>

        <aside class="sidebar">
            <div class="info-box">
                Information
            </div>
        </aside>

    </div>

    <!-- 頁尾 -->
    <footer class="footer">
        Here is footer
    </footer>

</body>
</html>
