<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 4 網頁</title>
    <!-- 引入 Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        /* 設定平順滑動效果 */
        html {
            scroll-behavior: smooth;
        }
        
        /* 頁面主要水藍色 Banner */
        .main-banner {
            height: 100vh;
            background-color: #87CEFA; /* 水藍色 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 導覽列位移修正：避免點擊跳轉時被 sticky-top 導覽列擋住標題 */
        section {
            scroll-margin-top: 60px;
        }

        /* 每個 Section 的深灰色背景與設定 */
        .content-section {
            height: 200vh;
            background-color: #343a40; /* 深灰色 */
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 2rem;
            color: white;
        }

        /* Section 內的橘紅色 Banner (都有保留) */
        .section-banner {
            background-color: #FF4500; /* 橘紅色 */
            color: white;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            border-radius: 5px;
        }

        /* 中間內容區塊的淺灰色框 */
        .content-box {
            background-color: #f8f9fa; /* 淺灰色 */
            color: #333; /* 深色文字 */
            padding: 3rem 1rem;
            border-radius: 5px;
            text-align: center;
            height: 100%; 
        }
    </style>
</head>
<body>

    <!-- 導覽列 Navbar (Sticky Top) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand" href="#">首頁</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#section1">區段一</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#section2">區段二</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#section3">區段三</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 最上方的 水藍色 Banner -->
    <div class="main-banner">
        <h1>這裡是Banner</h1>
    </div>

    <!-- 內容區域 -->
    <div class="container-fluid mt-4">
        
        <!-- 區段一 -->
        <section id="section1" class="content-section">
            <!-- 這是區段一的橘紅色 Banner -->
            <div class="section-banner">
                <h2>區段一 Banner</h2>
            </div>
            <!-- Grid System: 左邊留白 col-3, 中間內容 col-6, 右邊留白 col-3 -->
            <div class="row">
                <div class="col-3"></div>
                <div class="col-6">
                    <!-- 淺灰色框框 -->
                    <div class="content-box">
                        <h3>區段一</h3>
                    </div>
                </div>
                <div class="col-3"></div>
            </div>
        </section>

        <!-- 區段二 -->
        <section id="section2" class="content-section">
            <!-- 這是區段二的橘紅色 Banner -->
            <div class="section-banner">
                <h2>區段二 Banner</h2>
            </div>
            <div class="row">
                <div class="col-3"></div>
                <div class="col-6">
                    <!-- 淺灰色框框 -->
                    <div class="content-box">
                        <h3>區段二</h3>
                    </div>
                </div>
                <div class="col-3"></div>
            </div>
        </section>

        <!-- 區段三 -->
        <section id="section3" class="content-section">
            <!-- 這是區段三的橘紅色 Banner -->
            <div class="section-banner">
                <h2>區段三 Banner</h2>
            </div>
            <div class="row">
                <div class="col-3"></div>
                <div class="col-6">
                    <!-- 淺灰色框框 -->
                    <div class="content-box">
                        <h3>區段三</h3>
                    </div>
                </div>
                <div class="col-3"></div>
            </div>
        </section>

    </div>

    <!-- 引入 Bootstrap 4 必須的 JS, Popper.js 與 jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
